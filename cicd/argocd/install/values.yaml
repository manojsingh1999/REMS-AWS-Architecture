# argo-cd Helm chart (argo/argo-cd 7.7.x) - HA install, one ArgoCD per cluster (no cross-account
# cluster credentials; each environment's ArgoCD can only reach its own API server).
#
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd -n argocd --version 7.7.10 -f cicd/argocd/install/values.yaml
global:
  nodeSelector:
    rems.io/node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

redis-ha:
  enabled: true

controller:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
  # Exposed only on the internal ALB (VPN access)
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: rems-internal
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
    hostname: argocd.internal.rems.example.com # PLACEHOLDER

repoServer:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2

applicationSet:
  replicas: 2

configs:
  params:
    server.insecure: false
    application.namespaces: argocd
  cm:
    admin.enabled: false # SSO only
    exec.enabled: false
    statusbadge.enabled: false
    # SSO through IAM Identity Center (SAML) via Dex - PLACEHOLDER metadata URL
    dex.config: |
      connectors:
        - type: saml
          id: aws-identity-center
          name: AWS IAM Identity Center
          config:
            ssoURL: https://portal.sso.ap-south-1.amazonaws.com/saml/assertion/PLACEHOLDER
            caData: PLACEHOLDER-base64-ca
            redirectURI: https://argocd.internal.rems.example.com/api/dex/callback
            usernameAttr: email
            emailAttr: email
            groupsAttr: groups
    resource.customizations.health.argoproj.io_Rollout: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Healthy" then hs.status = "Healthy" end
        if obj.status.phase == "Degraded" then hs.status = "Degraded" end
        if obj.status.phase == "Paused" then hs.status = "Suspended" end
        if obj.status.phase == "Progressing" then hs.status = "Progressing" end
        hs.message = obj.status.message
        return hs
      end
      hs.status = "Progressing"
      return hs
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, rems-platform-admins, role:admin
      g, rems-oncall, proj:rems:oncall
      g, rems-developers, role:readonly
    scopes: "[groups]"

notifications:
  enabled: true
  notifiers:
    service.slack: |
      token: $slack-token
  subscriptions:
    - recipients: [slack:rems-deployments]
      triggers: [on-sync-failed, on-health-degraded, on-deployed]
