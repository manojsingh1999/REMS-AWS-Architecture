# Promote the exact image (tag + digest) that passed the lower environment. No rebuild.
name: promote

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service"
        required: true
        type: choice
        options: [rems-frontend, rems-api, authorization-service, data-governance, metadata-rca, chat-engine, mcp-server]
      path:
        description: "Promotion path"
        required: true
        type: choice
        options: [dev-to-staging, staging-to-prod]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy tag and digest
        id: copy
        env:
          SVC: ${{ inputs.service }}
          PROMOTION: ${{ inputs.path }}
        run: |
          set -euo pipefail
          from="${PROMOTION%%-to-*}"
          to="${PROMOTION##*-to-}"
          src="apps/${SVC}/values-${from}.yaml"
          dst="apps/${SVC}/values-${to}.yaml"
          tag="$(yq '.image.tag' "$src")"
          digest="$(yq '.image.digest // ""' "$src")"
          yq -i ".image.tag = \"${tag}\" | .image.digest = \"${digest}\"" "$dst"
          {
            echo "tag=${tag}"
            echo "from=${from}"
            echo "to=${to}"
          } >> "$GITHUB_OUTPUT"

      - name: Open promotion PR (CODEOWNERS approval required for staging/prod)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/${{ inputs.service }}-${{ steps.copy.outputs.to }}-${{ steps.copy.outputs.tag }}
          title: "deploy(${{ steps.copy.outputs.to }}): ${{ inputs.service }} ${{ steps.copy.outputs.tag }}"
          labels: deploy,${{ steps.copy.outputs.to }}
          commit-message: "deploy(${{ steps.copy.outputs.to }}): ${{ inputs.service }} ${{ steps.copy.outputs.tag }}"
          body: |
            Promotes `${{ inputs.service }}` **${{ steps.copy.outputs.tag }}** from `${{ steps.copy.outputs.from }}` to `${{ steps.copy.outputs.to }}`.
            Same immutable digest, no rebuild. After merge ArgoCD syncs and Argo Rollouts runs the canary with automatic rollback.
