# Kubernetes identity used by AWS FIS aws:eks:pod-* actions (map the FIS role to the
# "fis-experiment" user with an EKS access entry: kubernetes_groups = [], username = fis-experiment).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: rems
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-experiment
  namespace: rems
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, list, get, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [update]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-experiment
  namespace: rems
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: rems
  - kind: User
    name: fis-experiment
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: fis-experiment
  apiGroup: rbac.authorization.k8s.io
