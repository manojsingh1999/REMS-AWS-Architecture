  - name: rems-slo.alerts
    rules:
    - alert: RemsSLOAvailabilityBurnRate
      expr: |-
        rems:slo_errors_ratio:rate1h{service_name="rems-api"} > (14.4 * 0.0005)
        and
        rems:slo_errors_ratio:rate5m{service_name="rems-api"} > (14.4 * 0.0005)
      for: 2m
      labels:
        severity: critical
        service: rems-api
        slo: availability
        window: 1h
      annotations:
        summary: rems-api is burning its 99.95% availability error budget 14.4x too fast (1h/5m windows)
        runbook_url: https://github.com/your-github-org/REMS-AWS-Architecture/blob/main/runbooks/slo-burn-rate.md
    - alert: RemsSLOAvailabilityBurnRate
      expr: |-
        rems:slo_errors_ratio:rate6h{service_name="rems-api"} > (6 * 0.0005)
        and
        rems:slo_errors_ratio:rate30m{service_name="rems-api"} > (6 * 0.0005)
      for: 15m
      labels:
        severity: critical
        service: rems-api
        slo: availability
        window: 6h
      annotations:
        summary: rems-api is burning its 99.95% availability error budget 6x too fast (6h/30m windows)
        runbook_url: https://github.com/your-github-org/REMS-AWS-Architecture/blob/main/runbooks/slo-burn-rate.md
    - alert: RemsSLOAvailabilityBurnRate
      expr: |-
        rems:slo_errors_ratio:rate1d{service_name="rems-api"} > (3 * 0.0005)
        and
        rems:slo_errors_ratio:rate2h{service_name="rems-api"} > (3 * 0.0005)
      for: 1h
      labels:
        severity: warning
        service: rems-api
        slo: availability
        window: 1d
      annotations:
        summary: rems-api is burning its 99.95% availability error budget 3x too fast (1d/2h windows)
        runbook_url: https://github.com/your-github-org/REMS-AWS-Architecture/blob/main/runbooks/slo-burn-rate.md
    - alert: RemsSLOAvailabilityBurnRate
      expr: |-
        rems:slo_errors_ratio:rate3d{service_name="rems-api"} > (1 * 0.0005)
        and
        rems:slo_errors_ratio:rate6h{service_name="rems-api"} > (1 * 0.0005)
      for: 3h
      labels:
        severity: warning
        service: rems-api
        slo: availability
        window: 3d
      annotations:
        summary: rems-api is burning its 99.95% availability error budget 1x too fast (3d/6h windows)
        runbook_url: https://github.com/your-github-org/REMS-AWS-Architecture/blob/main/runbooks/slo-burn-rate.md
    - alert: RemsSLOLatencyBurnRate
      expr: |-
        rems:slo_latency_violations_ratio:rate1h{service_name="rems-api"} > (14.4 * 0.01)
        and
        rems:slo_latency_violations_ratio:rate5m{service_name="rems-api"} > (14.4 * 0.01)
      for: 2m
      labels:
        severity: critical
        service: rems-api
        slo: latency
        window: 1h
      annotations:
