# metadata-rca - staging overrides (seed copy - the live file is apps/<svc>/values-<env>.yaml in rems-microconfig, managed by CI + promote PRs)
image:
  tag: sha-0000000
rollout:
  enabled: true
autoscaling:
  minReplicas: 1
  maxReplicas: 3
otel:
  samplerRatio: '0.5'
externalSecrets:
- name: metadata-rca-db
  remoteKey: rems/staging/aurora/rems-staging-rag/metadata-rca
  refreshInterval: 1h
  envFrom: false
- name: metadata-rca-redis
  remoteKey: rems/staging/redis/rems-staging-cache
  refreshInterval: 1h
  envFrom: false
networkPolicy:
  egressCIDRs:
  - cidr: 10.20.3.0/24
    ports:
    - 5432
    - 6379
  - cidr: 10.20.4.0/24
    ports:
    - 5432
    - 6379
  - cidr: 10.20.5.0/24
    ports:
    - 5432
    - 6379
  - cidr: 0.0.0.0/0
    ports:
    - 443
