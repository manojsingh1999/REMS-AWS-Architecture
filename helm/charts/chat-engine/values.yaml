# Default values for chat-engine.
# REMS Chat Engine (AI-driven incident, alert, infrastructure, log and trace analysis)
# Environment overrides: values-<env>.yaml + ../../environments/<env>/global.yaml (passed by ArgoCD).
# Values marked PLACEHOLDER come from the service repository - see documentation/02-assumptions.md.

# ---------------------------------------------------------------- global (overridden by environments/<env>/global.yaml)
global:
  environment: dev
  awsRegion: ap-south-1
  vpcCidr: 10.10.0.0/16
  dataSubnetCIDRs:
  - 10.10.3.0/24
  - 10.10.4.0/24
  - 10.10.5.0/24
  secretStore: aws-secrets-manager
  ingress:
    publicGroup: rems-public
    internalGroup: rems-internal
    certificateArn: PLACEHOLDER-acm-certificate-arn
    wafAclArn: PLACEHOLDER-waf-acl-arn
    accessLogsBucket: PLACEHOLDER-alb-logs-bucket
    deletionProtection: false

# ---------------------------------------------------------------- identity
nameOverride: ''
component: chat
image:
  repository: 444444444444.dkr.ecr.ap-south-1.amazonaws.com/rems/chat-engine
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
# PLACEHOLDER(P1/P2): container port from the service Dockerfile EXPOSE / uvicorn --port
containerPort: 8000
command: []
args: []

# Non-secret, application-specific settings rendered into a ConfigMap (envFrom). Intentionally empty:
# env var names are not invented - add them from the service's settings class.
config: {}
extraEnv: {}

# ---------------------------------------------------------------- delivery
replicaCount: 1
rollout:
  enabled: false
  steps:
  - setWeight: 10
  - pause:
      duration: 2m
  - setWeight: 25
  - pause:
      duration: 3m
  - setWeight: 50
  - pause:
      duration: 5m
  - setWeight: 100
  analysis:
    enabled: true
    templates:
    - rems-http-error-rate
    - rems-http-latency-p95

# ---------------------------------------------------------------- pod
serviceAccount:
  create: true
  name: ''
  automountToken: false
priorityClassName: rems-high
nodePool: ai
topologySpread:
  enabled: true
  zoneWhenUnsatisfiable: ScheduleAnyway
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 15
tmpSizeLimit: 256Mi
podLabels: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
    - ALL
extraVolumes: []
extraVolumeMounts: []

# PLACEHOLDER(P3): health endpoints of the service
probes:
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------- resources (Guaranteed memory: request == limit)
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 1Gi

# ---------------------------------------------------------------- autoscaling (HPA or KEDA; KEDA always includes a CPU trigger)
autoscaling:
  enabled: true
  type: keda
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
  keda:
    triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: sum(http_server_active_requests{service_name="chat-engine"})
        threshold: '20'
pdb:
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------- networking
service:
  port: 80
ingress:
  enabled: true
  scheme: internet-facing
  groupName: ''
  order: 20
  host: app.dev.rems.example.com
  paths:
  - /chat
  idleTimeoutSeconds: 300
  annotations: {}
# PLACEHOLDER(P7): path prefixes are routing assumptions - align with the real API routes.

# ---------------------------------------------------------------- network policy (default-deny namespace baseline + this allow-list)
networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo:
  - namespace: rems
    app: authorization-service
    ports:
    - 8000
  - namespace: rems
    app: rems-api
    ports:
    - 8000
  - namespace: rems-ai
    app: mcp-server
    ports:
    - 8000
  - namespace: rems-ai
    app: metadata-rca
    ports:
    - 8000
  - namespace: rems-ai
    app: llm-gateway
    ports:
    - 4000
  egressCIDRs:
  - cidr: 10.10.3.0/24
    ports:
    - 6379
  - cidr: 10.10.4.0/24
    ports:
    - 6379
  - cidr: 10.10.5.0/24
    ports:
    - 6379
  allowKubeAPI: false

# ---------------------------------------------------------------- secrets (AWS Secrets Manager via External Secrets)
# Mounted as files at /var/run/secrets/rems/<name>/<key>. Set envFrom: true or `keys: {ENV_NAME: json_key}`
# once the service's expected variable names are confirmed.
externalSecrets:
- name: chat-engine-redis
  remoteKey: rems/dev/redis/rems-dev-cache
  refreshInterval: 1h
  envFrom: false

# ---------------------------------------------------------------- observability
otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc:4318
  protocol: http/protobuf
  samplerRatio: '0.1'
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
# PLACEHOLDER(P4): metrics path

# Background worker not used by this service.
worker:
  enabled: false
