# rems-api - prod overrides (seed copy - the live file is apps/<svc>/values-<env>.yaml in rems-microconfig, managed by CI + promote PRs)
image:
  tag: sha-0000000
rollout:
  enabled: true
autoscaling:
  minReplicas: 6
  maxReplicas: 40
otel:
  samplerRatio: '0.1'
externalSecrets:
- name: rems-api-db
  remoteKey: rems/prod/aurora/rems-prod-core/rems-api
  refreshInterval: 1h
  envFrom: false
- name: rems-api-redis
  remoteKey: rems/prod/redis/rems-prod-cache
  refreshInterval: 1h
  envFrom: false
networkPolicy:
  egressCIDRs:
  - cidr: 10.30.3.0/24
    ports:
    - 5432
    - 6379
  - cidr: 10.30.4.0/24
    ports:
    - 5432
    - 6379
  - cidr: 10.30.5.0/24
    ports:
    - 5432
    - 6379
ingress:
  host: app.rems.example.com
