# data-governance - staging overrides (seed copy - the live file is apps/<svc>/values-<env>.yaml in rems-microconfig, managed by CI + promote PRs)
image:
  tag: sha-0000000
rollout:
  enabled: true
autoscaling:
  minReplicas: 1
  maxReplicas: 3
otel:
  samplerRatio: '0.5'
externalSecrets:
- name: data-governance-db
  remoteKey: rems/staging/aurora/rems-staging-core/data-governance
  refreshInterval: 1h
  envFrom: false
networkPolicy:
  egressCIDRs:
  - cidr: 10.20.3.0/24
    ports:
    - 5432
  - cidr: 10.20.4.0/24
    ports:
    - 5432
  - cidr: 10.20.5.0/24
    ports:
    - 5432
  - cidr: 10.20.0.0/16
    ports:
    - 443
  - cidr: 172.31.0.0/16
    ports:
    - 5432
    - 3306
