# data-governance - prod-dr (ap-southeast-1) overrides, layered on values-prod.yaml.
# Warm standby: 1 replica per service. During failover (runbooks/dr-regional-failover.md) the
# 'dr-scale-up' PR deletes the autoscaling override so prod minimums apply.
# Aurora secrets are Secrets Manager replicas (same names as primary); Redis is the DR cluster.
autoscaling:
  minReplicas: 1
pdb:
  enabled: true
  minAvailable: null
  maxUnavailable: 1
externalSecrets:
- name: data-governance-db
  remoteKey: rems/prod/aurora/rems-prod-core/data-governance
  refreshInterval: 1h
  envFrom: false
networkPolicy:
  egressCIDRs:
  - cidr: 10.40.3.0/24
    ports:
    - 5432
  - cidr: 10.40.4.0/24
    ports:
    - 5432
  - cidr: 10.40.5.0/24
    ports:
    - 5432
  - cidr: 10.40.0.0/16
    ports:
    - 443
