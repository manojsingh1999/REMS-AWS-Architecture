# rems-frontend - prod overrides (seed copy - the live file is apps/<svc>/values-<env>.yaml in rems-microconfig, managed by CI + promote PRs)
image:
  tag: sha-0000000
rollout:
  enabled: true
autoscaling:
  minReplicas: 3
  maxReplicas: 10
pdb:
  enabled: true
  minAvailable: 2
ingress:
  host: app.rems.example.com
