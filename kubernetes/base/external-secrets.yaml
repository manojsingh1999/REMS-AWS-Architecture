# External Secrets Operator reads AWS Secrets Manager with its own Pod Identity role
# (scoped to rems/<env>/*). Each service chart declares ExternalSecrets that reference this store.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
  conditions:
    - namespaces: [rems, rems-ai, observability, monitoring]
