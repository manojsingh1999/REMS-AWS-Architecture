---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  labels:
    rems.io/tier: platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    rems.io/tier: platform
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
