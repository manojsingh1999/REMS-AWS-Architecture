# Infrastructure pipeline.
#  PR   : fmt, validate, tflint, checkov, plan per environment (read-only OIDC role), plan posted to the PR
#  main : apply dev automatically -> staging (approval) -> prod + prod-dr (2 approvals, change window)
name: terraform

on:
  pull_request:
    paths: ["terraform/**", "security/iam/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "security/iam/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # never cancel an apply mid-way

env:
  TF_VERSION: "1.10.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform validate (all stacks and modules)
        run: |
          set -euo pipefail
          for d in $(find terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate ${d}"
            terraform -chdir="${d}" init -backend=false -input=false >/dev/null
            terraform -chdir="${d}" validate
            echo "::endgroup::"
          done
      - name: Offline consistency check
        run: |
          pip install python-hcl2==8.*
          python3 scripts/tf_static_check.py terraform
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir terraform
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: .checkov.yaml
          framework: terraform

  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod, prod-dr]
    environment: plan-${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN }}
          aws-region: ap-south-1
      - name: Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
          terraform show -no-color tfplan | tail -c 60000 > plan-summary.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`terraform/environments/${process.env.ENV_NAME}/plan-summary.txt`, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `### Terraform plan: \`${process.env.ENV_NAME}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`
            });

  apply:
    name: Apply (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1 # dev -> staging -> prod -> prod-dr, in order, each gated by its GitHub Environment
      matrix:
        env: [dev, staging, prod, prod-dr]
    environment: ${{ matrix.env }} # staging/prod/prod-dr require reviewers + wait timer
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: ap-south-1
          role-duration-seconds: 7200
      - name: Apply
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
