# Nightly security posture of the platform repository and the images running in production.
name: security-scan

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  repo:
    name: Secrets + IaC misconfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  running-images:
    name: Re-scan images deployed to prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [rems-frontend, rems-api, authorization-service, data-governance, metadata-rca, chat-engine, mcp-server]
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PULL_ROLE }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve prod image
        id: img
        env:
          SVC: ${{ matrix.service }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          tag="$(yq '.image.tag' "helm/charts/${SVC}/values-prod.yaml")"
          echo "ref=${REGISTRY}/rems/${SVC}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Trivy image (new CVEs since release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: image-${{ matrix.service }}
