apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-provider-keys
  namespace: rems-ai
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway-provider-keys
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: rems/ENV/llm/openai
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: rems/ENV/llm/anthropic
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-master-key
  namespace: rems-ai
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway-master-key
  data:
    - secretKey: masterkey
      remoteRef:
        key: rems/ENV/llm/master-key # created out-of-band (runbook), never in Terraform state
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-db
  namespace: rems-ai
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway-db
  data:
    - secretKey: username
      remoteRef:
        key: rems/ENV/aurora/rems-ENV-core/llm-gateway
        property: username
    - secretKey: password
      remoteRef:
        key: rems/ENV/aurora/rems-ENV-core/llm-gateway
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-redis
  namespace: rems-ai
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway-redis
  data:
    - secretKey: REDIS_HOST
      remoteRef:
        key: rems/ENV/redis/rems-ENV-cache
        property: host
    - secretKey: REDIS_PORT
      remoteRef:
        key: rems/ENV/redis/rems-ENV-cache
        property: port
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: rems/ENV/redis/rems-ENV-cache
        property: auth_token
